# Dev container for GitHub Codespaces. The workspace container shares the network of the
# PostgreSQL container, so `localhost:5432` works exactly as configured in .env.example.
# Redis, MinIO and Mailpit are not needed: the defaults use in-memory rate limiting and write
# e-mails to the API log.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Superuser for `pnpm db:reset`, which creates the application roles and the database.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
