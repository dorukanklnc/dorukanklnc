# Local development dependencies. Nothing here is needed in production as-is;
# production uses managed PostgreSQL, Redis and S3-compatible object storage.
#
#   pnpm infra:up      # start
#   pnpm infra:down    # stop (data volumes are kept)
#
name: campusos

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campusos
      # Passwords for the application roles created by init/01-roles.sh.
      # Development-only values; production roles are provisioned by the DBA/IaC.
      APP_OWNER_PASSWORD: app_owner_dev
      APP_RUNTIME_PASSWORD: app_runtime_dev
      APP_SYSTEM_PASSWORD: app_system_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d campusos']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. Optional: the API defaults to the local
  # filesystem storage driver; set STORAGE_DRIVER=s3 to exercise this.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/campusos-files &&
      mc anonymous set none local/campusos-files
      "

  # Catches every outgoing e-mail in development. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  redis-data:
  minio-data:
